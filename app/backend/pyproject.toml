[project]
name = "returnguard"
version = "0.1.0"
description = "ReturnGuard API and pipeline worker"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=25.1.0",
    "asgi-correlation-id>=4.3",
    "asyncpg>=0.30",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "limits>=5.8.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnguard"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["returnguard"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asgi_correlation_id.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../../tests/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a running Postgres (DATABASE_URL)"]
