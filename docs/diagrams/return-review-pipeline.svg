<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1940" viewBox="0 0 1400 1940"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#596675"/></marker></defs><rect width="1400" height="1940" fill="white"/><g font-family="Arial, sans-serif"><text x="700.0" y="55.0" text-anchor="middle" font-size="30" fill="#243342">ReturnGuard · How a return is reviewed</text><text x="700.0" y="93.0" text-anchor="middle" font-size="18" fill="#243342">Clear cases can be approved automatically. Every denial needs a person.</text><rect x="460" y="135" width="480" height="70" rx="14" fill="#f3f5f7" stroke="#596675" stroke-width="1.5"/><text x="700.0" y="165.0" text-anchor="middle" font-size="20" fill="#243342">Customer submits return</text><text x="700.0" y="190.0" text-anchor="middle" font-size="20" fill="#243342">Save request and queue processing job</text><polyline points="700,205 700,265" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="70" y="298.0" text-anchor="start" font-size="18" fill="#243342">1  VALIDATE THE REQUEST</text><rect x="460" y="265" width="480" height="80" rx="14" fill="#e6f3ed" stroke="#39765b" stroke-width="1.5"/><text x="700.0" y="300.0" text-anchor="middle" font-size="20" fill="#243342">Check required evidence</text><text x="700.0" y="325.0" text-anchor="middle" font-size="20" fill="#243342">Is everything needed available?</text><polyline points="940,305 1030,305" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="986.0" y="286.0" text-anchor="middle" font-size="16" fill="#243342">Missing</text><rect x="1030" y="265" width="310" height="80" rx="14" fill="#f3f5f7" stroke="#596675" stroke-width="1.5"/><text x="1185.0" y="300.0" text-anchor="middle" font-size="20" fill="#243342">Ask customer for</text><text x="1185.0" y="325.0" text-anchor="middle" font-size="20" fill="#243342">missing evidence</text><polyline points="1185,265 1185,170 940,170" fill="none" stroke="#596675" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1115.0" y="214.0" text-anchor="middle" font-size="16" fill="#243342">Customer adds evidence</text><polyline points="700,345 700,395" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="710" y="370.0" text-anchor="start" font-size="16" fill="#243342">Complete</text><rect x="460" y="395" width="480" height="85" rx="14" fill="#e6f3ed" stroke="#39765b" stroke-width="1.5"/><text x="700.0" y="432.5" text-anchor="middle" font-size="20" fill="#243342">Check policy facts</text><text x="700.0" y="457.5" text-anchor="middle" font-size="20" fill="#243342">Return window · Final Sale · refund amount</text><polyline points="700,480 700,550" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="70" y="584.0" text-anchor="start" font-size="18" fill="#243342">2  EVALUATE THE RETURN</text><rect x="460" y="550" width="480" height="90" rx="14" fill="#fff0d8" stroke="#a97524" stroke-width="1.5"/><text x="700.0" y="590.0" text-anchor="middle" font-size="20" fill="#243342">Determine policy eligibility</text><text x="700.0" y="615.0" text-anchor="middle" font-size="20" fill="#243342">Retrieve and cite applicable policy clauses</text><polyline points="700,640 700,680" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="460" y="680" width="480" height="90" rx="14" fill="#fff0d8" stroke="#a97524" stroke-width="1.5"/><text x="700.0" y="708.375" text-anchor="middle" font-size="19" fill="#243342">Assess photo evidence</text><text x="700.0" y="732.125" text-anchor="middle" font-size="19" fill="#243342">Does it support the claim?</text><text x="700.0" y="755.875" text-anchor="middle" font-size="19" fill="#243342">Compare with catalog photo when available</text><polyline points="700,770 700,810" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="460" y="810" width="480" height="90" rx="14" fill="#e6f3ed" stroke="#39765b" stroke-width="1.5"/><text x="700.0" y="838.375" text-anchor="middle" font-size="19" fill="#243342">Calculate behavior risk</text><text x="700.0" y="862.125" text-anchor="middle" font-size="19" fill="#243342">Return frequency · recent returns · account age</text><text x="700.0" y="885.875" text-anchor="middle" font-size="19" fill="#243342">Shared address · refund amount</text><polyline points="700,900 700,940" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="460" y="940" width="480" height="85" rx="14" fill="#fff0d8" stroke="#a97524" stroke-width="1.5"/><text x="700.0" y="977.75" text-anchor="middle" font-size="19" fill="#243342">Recommend approve, deny, or escalate</text><text x="700.0" y="1001.5" text-anchor="middle" font-size="19" fill="#243342">Explain findings and uncertainties</text><polyline points="700,1025 700,1065" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="460" y="1065" width="480" height="85" rx="14" fill="#fff0d8" stroke="#a97524" stroke-width="1.5"/><text x="700.0" y="1102.75" text-anchor="middle" font-size="19" fill="#243342">Review the recommendation</text><text x="700.0" y="1126.5" text-anchor="middle" font-size="19" fill="#243342">Flag contradictions and unsupported conclusions</text><polyline points="700,1150 700,1220" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="70" y="1253.0" text-anchor="start" font-size="18" fill="#243342">3  ROUTE THE CASE</text><rect x="460" y="1220" width="480" height="100" rx="14" fill="#e6f3ed" stroke="#39765b" stroke-width="1.5"/><text x="700.0" y="1253.375" text-anchor="middle" font-size="19" fill="#243342">Check automatic-approval conditions</text><text x="700.0" y="1277.125" text-anchor="middle" font-size="19" fill="#243342">Evidence clear · automation enabled</text><text x="700.0" y="1300.875" text-anchor="middle" font-size="19" fill="#243342">Within risk/value limits · not selected for QA</text><polyline points="580,1320 580,1370 350,1370 350,1410" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="425.0" y="1351.0" text-anchor="middle" font-size="18" fill="#243342">All conditions met</text><polyline points="820,1320 820,1370 1050,1370 1050,1410" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><text x="1055.0" y="1351.0" text-anchor="middle" font-size="18" fill="#243342">Any condition not met</text><rect x="120" y="1410" width="460" height="80" rx="14" fill="#dbf0df" stroke="#348348" stroke-width="1.5"/><text x="350.0" y="1458.25" text-anchor="middle" font-size="22" fill="#243342">Approve return automatically</text><rect x="820" y="1410" width="460" height="150" rx="14" fill="#eee8fa" stroke="#7855a2" stroke-width="1.5"/><text x="1050.0" y="1466.625" text-anchor="middle" font-size="21" fill="#243342">Send to reviewer with reasons</text><text x="1050.0" y="1492.875" text-anchor="middle" font-size="21" fill="#243342">Inspect evidence and policy</text><text x="1050.0" y="1519.125" text-anchor="middle" font-size="21" fill="#243342">Approve or confirm denial</text><text x="1050.0" y="1597.0" text-anchor="middle" font-size="17" fill="#243342">Reasons include: proposed denial, uncertainty,</text><text x="1050.0" y="1618.25" text-anchor="middle" font-size="17" fill="#243342">unverified photo, review concern, elevated risk,</text><text x="1050.0" y="1639.5" text-anchor="middle" font-size="17" fill="#243342">high value, QA sample, or automation disabled.</text><rect x="1025" y="1040" width="315" height="100" rx="14" fill="#f3f5f7" stroke="#596675" stroke-width="1.5"/><text x="1182.5" y="1085.25" text-anchor="middle" font-size="19" fill="#243342">Processing fails</text><text x="1182.5" y="1109.0" text-anchor="middle" font-size="19" fill="#243342">after retries are exhausted</text><polyline points="1180,1140 1360,1140 1360,1485 1280,1485" fill="none" stroke="#596675" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><polyline points="350,1490 350,1715 700,1715" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><polyline points="1050,1650 1050,1715 700,1715" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="460" y="1715" width="480" height="80" rx="14" fill="#f3f5f7" stroke="#596675" stroke-width="1.5"/><text x="700.0" y="1762.875" text-anchor="middle" font-size="21" fill="#243342">Notify customer of decision</text><polyline points="940,1755 1020,1755" fill="none" stroke="#596675" stroke-width="1.6"  marker-end="url(#arrow)"/><rect x="1020" y="1695" width="320" height="125" rx="14" fill="#eee8fa" stroke="#7855a2" stroke-width="1.5"/><text x="1180.0" y="1741.75" text-anchor="middle" font-size="18" fill="#243342">If denied, customer can</text><text x="1180.0" y="1764.25" text-anchor="middle" font-size="18" fill="#243342">request another review</text><text x="1180.0" y="1786.75" text-anchor="middle" font-size="18" fill="#243342">A different reviewer decides</text><text x="705.0" y="1864.0" text-anchor="middle" font-size="19" fill="#243342">Recorded throughout: step results and timing · routing reasons · reviewer actions</text><text x="705.0" y="1906.0" text-anchor="middle" font-size="16" fill="#243342">Without a configured model provider, conservative rule-based checks run; required photos remain unverified.</text></g></svg>